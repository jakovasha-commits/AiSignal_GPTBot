services:
  tradingbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      - "${POCKETOPTION_POSTBACK_HOST_PORT:-9109}:9109"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
